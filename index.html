<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RomméScore 4.4.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#073d24;color:#fff}
.app{max-width:820px;margin:auto;min-height:100vh;background:#0a4b2c}
.head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#063c23}
.logo{width:48px;height:58px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:28px}
.head h1{margin:0;font-size:27px}.head p{margin:4px 0 0;color:#d8efe2}.gear{margin-left:auto;border:0;background:#ffffff18;color:#fff;border-radius:12px;width:46px;height:46px;font-size:22px}
main{background:#fff;color:#17251e;min-height:calc(100vh - 86px);padding:16px 14px 92px}
.card{border:1px solid #dfe7e2;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px #00000010}.hero{background:linear-gradient(145deg,#fff,#f4fff8)}
h2{margin:0 0 8px;font-size:28px}.muted{color:#6d7872}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;margin:5px 0}.green{background:#0b6a3f;color:#fff}.light{background:#eaf6ef;color:#0b6a3f}.red{background:#ffe8e8;color:#a62b2b}.back{border:0;background:none;color:#0b6a3f;font-weight:800;padding:0 0 10px}
.row{display:flex;align-items:center;gap:12px;background:#f4f9f6;border:1px solid #e5eee8;border-radius:16px;padding:10px;margin:10px 0}.selectable{cursor:pointer;transition:.15s}.selectable.selectedPlayer{background:#e7f6ed;border-color:#0b6a3f;box-shadow:0 0 0 2px #0b6a3f22}.pick{width:26px;height:26px;accent-color:#0b6a3f;flex:none}.selectionBar{background:#edf8f1;color:#155c36;border-radius:12px;padding:11px;margin:10px 0;font-weight:800}.info{flex:1}.info b{display:block;font-size:19px}.info small{color:#6d7872}.score{font-weight:900;font-size:23px}
.avatarShell{width:72px;height:72px;border-radius:50%;padding:0;border:4px solid #0b6a3f;display:grid;place-items:center;flex:none;overflow:hidden}.avatarInner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:transparent;display:grid;place-items:center;font-weight:900;color:#0b6a3f;position:relative}.avatarInner img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;opacity:.92;transform-origin:center center}
.pat1{background:repeating-conic-gradient(from 0deg,#e9f7d7 0 11deg,#cfeab9 11deg 22deg)}.pat2{background-color:#dff1fb;background-image:radial-gradient(#b9ddef 17%,transparent 18%);background-size:14px 14px}.pat3{background:repeating-conic-gradient(from 8deg,#fff0d5 0 13deg,#fbdcad 13deg 26deg)}.pat4{background:#f9dede}.pat5{background:#eee3f7}.pat6{background:#fff6cf}.pat7{background:#def4ea}.pat8{background:#efefef}
.form{display:flex;gap:8px}.field{width:100%;padding:13px;border:2px solid #dce6e0;border-radius:12px;font-size:16px}.form .field{flex:1}.notice{background:#fff6d8;color:#6f5610;border-radius:12px;padding:12px;margin-top:10px}.ok{background:#eaf8ef;color:#155c36}
.editor{display:grid;grid-template-columns:250px 1fr;gap:18px}.preview{width:240px;height:240px;border-radius:50%;padding:0;border:10px solid #0b6a3f;margin:auto;overflow:hidden}.previewInner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:48px;font-weight:900;color:#0b6a3f;position:relative}.previewInner img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;opacity:.92;transform-origin:center center;touch-action:none;user-select:none;-webkit-user-drag:none}.previewInner{touch-action:none;cursor:grab}.previewInner.dragging{cursor:grabbing}.gestureHint{background:#eaf8ef;color:#155c36;border-radius:12px;padding:10px;margin-top:10px;font-size:13px}.controlGroup{margin:14px 0}.controlGroup label{display:block;font-weight:800;margin-bottom:5px}.controlGroup input[type=range]{width:100%}.controlValue{font-size:12px;color:#6d7872;text-align:right}.resetBtn{width:100%;border:0;border-radius:11px;padding:10px;background:#f3f3f3;color:#444;font-weight:800;margin-top:8px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{aspect-ratio:1;border-radius:12px;border:3px solid transparent}.sel{border-color:#111}.frames{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.frame{aspect-ratio:1;border-radius:50%;background:#fff;border:7px solid}.f1{border-color:#0b6a3f}.f2{border-color:#111}.f3{border-color:#e7b548}.f4{border-color:#b82d2d}.f5{border-color:#315fa7}.f6{border-color:#fff;box-shadow:0 0 0 1px #bbb}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cardbtn{border:2px solid #dfe9e3;background:#fff;border-radius:10px;padding:10px 4px;font-weight:900}.redtxt{color:#b32626}
.realCardBtn{border:0;background:transparent;padding:2px;border-radius:10px}
.realCardBtn img{display:block;width:100%;height:auto;aspect-ratio:2.5/3.5;object-fit:contain;border-radius:7px;box-shadow:0 2px 7px #0002;background:white}
.realCardBtn:active{transform:scale(.96)}
.cardLabel{text-align:center;font-size:11px;font-weight:800;margin-top:2px;color:#536159}
.cardSourceNote{font-size:12px;color:#6d7872;margin:8px 0 12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#edf8f1;color:#0b6a3f;padding:7px 9px;border-radius:999px;font-size:13px;font-weight:800}.summary{background:#edf8f1;border-radius:12px;padding:12px;margin-top:10px}.sectionTitle{margin-top:22px;padding-top:16px;border-top:1px solid #e1e6e3}.photoBox{border:2px dashed #a9c8b5;border-radius:14px;padding:14px;background:#f7fbf8;text-align:center}.photoPreview{width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:10px;background:#eef4f0}
.recognitionBox{background:#f4f9f6;border:1px solid #dfe9e3;border-radius:14px;padding:12px;margin-top:12px}
.recognitionHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.recognitionTotal{font-size:24px;font-weight:900;color:#0b6a3f}
.recognizedList{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.recognizedCard{display:flex;align-items:center;gap:6px;background:white;border:1px solid #dce7df;border-radius:999px;padding:7px 9px;font-weight:800}
.recognizedCard button{border:0;background:#ffe8e8;color:#a62b2b;border-radius:999px;width:24px;height:24px;font-weight:900}.conf{font-size:11px;color:#6d7872}
.addCardRow{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:10px}.addCardRow select{padding:10px;border:1px solid #d6e1da;border-radius:10px;background:white}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #ffffff66;border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.statBox{background:#f4f9f6;border:1px solid #e5eee8;border-radius:14px;padding:13px}
.statBox span{display:block;color:#6d7872;font-size:13px}.statBox b{display:block;font-size:25px;margin-top:3px}
.playerStats{border:1px solid #e5eee8;border-radius:16px;padding:12px;margin:11px 0;background:#fbfdfc}
.playerStatsHead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.playerStatsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.miniStat{background:#eef7f2;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:#68736d}
.miniStat b{display:block;color:#17251e;font-size:18px}
.historyGame{background:#f4f9f6;border-radius:13px;padding:11px;margin:8px 0}
.winner{outline:3px solid #e5b64a;background:#fff9df}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(820px,100%);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 2px 9px}.nav{color:#68716c;text-align:center;font-size:11px}.nav span{display:block;font-size:22px}.nav.on{color:#0b6a3f;font-weight:900}.hidden{display:none}
#errorBox{display:none;background:#ffeaea;color:#8b2828;padding:12px;border-radius:12px;margin-bottom:12px;white-space:pre-wrap}
@media(max-width:620px){.editor{grid-template-columns:1fr}.form{flex-direction:column}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="head">
  <div class="logo">🃏</div>
  <div><h1>RomméScore</h1><p>Version 4.4.1 · Kartenerkennung-Fix</p></div>
  <button class="gear" id="gearBtn">⚙️</button>
</header>

<main id="appMain">
  <div id="errorBox"></div>
  <section class="card hero">
    <h2>Rommé spielen. Punkte vergessen.</h2>
    <p class="muted">Falls JavaScript auf deinem Handy aus irgendeinem Grund nicht startet, bleibt wenigstens diese Startseite sichtbar.</p>
    <button class="btn green" id="staticNewGame">➕ Neues Spiel</button>
    <button class="btn light" id="staticContinue">▶️ Spiel fortsetzen</button>
    <button class="btn light" id="staticPlayers">👥 Spieler verwalten</button>
  </section>
</main>

<nav class="bottom">
  <div id="nGame" class="nav on"><span>🃏</span>Partie</div>
  <div id="nPlayers" class="nav"><span>👥</span>Spieler</div>
  <div id="nPoints" class="nav"><span>▮▮▮</span>Punkte</div>
  <div id="nStats" class="nav"><span>◔</span>Statistik</div>
  <div id="nSettings" class="nav"><span>⚙️</span>Einstellungen</div>
</nav>
<input id="avatarFile" type="file" accept="image/*" class="hidden"><input id="cardPhotoFile" type="file" accept="image/*" capture="environment" class="hidden">
</div>

<script>
(function(){
"use strict";

var KEY="rommescore_v35";
var main=document.getElementById("appMain");
var db=loadDb();
var startMode=false, editId=null, pendingAvatar=null, pattern="pat1", frame="f1", avatarScale=1, avatarX=0, avatarY=0, currentLoser=null, selectedCards=[], selectedPlayerIds=[], cardPhotoData=null, dragStartX=0, dragStartY=0, dragBaseX=0, dragBaseY=0, pinchStartDist=0, pinchBaseScale=1,recognizedCards=[];
var frameColors={f1:"#0b6a3f",f2:"#111",f3:"#e7b548",f4:"#b82d2d",f5:"#315fa7",f6:"#fff"};

function defaults(){return {players:[],game:null,history:[],rules:{ace:11,joker:20,handMultiplier:2},online:{recognitionUrl:""}}}
function loadDb(){try{var s=localStorage.getItem(KEY),d=s?JSON.parse(s):defaults();if(!d.rules)d.rules=defaults().rules;if(!d.online)d.online={recognitionUrl:""};return d}catch(e){return defaults()}}
function saveDb(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function showError(e){var b=document.getElementById("errorBox");if(!b)return;b.style.display="block";b.textContent="App-Fehler: "+(e&&e.message?e.message:String(e));}
function run(fn){try{fn()}catch(e){showError(e)}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function ini(n){var a=String(n).trim().split(/\s+/),r="";for(var i=0;i<a.length&&i<2;i++){if(a[i])r+=a[i].charAt(0)}return r.toUpperCase()||"👤"}
function cardValue(r){if(r==="Joker")return db.rules.joker;if(r==="B"||r==="D"||r==="K")return 10;if(r==="A")return db.rules.ace;return Number(r)||0}
function nav(id){["nGame","nPlayers","nPoints","nStats","nSettings"].forEach(function(x){document.getElementById(x).classList.toggle("on",x===id)})}
function avatar(p){
 var pat=p.avatarPattern||"pat1",fr=p.avatarFrame||"f1";
 var sc=(p.avatarScale==null?1:Number(p.avatarScale)),x=Number(p.avatarX)||0,y=Number(p.avatarY)||0;
 var img=p.avatar?'<img src="'+p.avatar+'" style="transform:translate('+x+'%, '+y+'%) scale('+sc+')">':ini(p.name);
 return '<div class="avatarShell '+pat+'" style="border-color:'+frameColors[fr]+'"><div class="avatarInner">'+img+'</div></div>';
}
function resetError(){var b=document.getElementById("errorBox");if(b){b.style.display="none";b.textContent=""}}
function button(text,cls,fn){var b=document.createElement("button");b.className="btn "+cls;b.textContent=text;b.addEventListener("click",function(){run(fn)});return b}

function showHome(){
 nav("nGame");
 main.innerHTML='<div id="errorBox"></div><section class="card hero" id="homeCard"><h2>Rommé spielen. Punkte vergessen.</h2><p class="muted">Spieler, Karikaturen, Pastell-Hintergründe, Runden, Handspiel, Punkte, Historie und Statistik.</p></section>';
 var c=document.getElementById("homeCard");
 c.appendChild(button("➕ Neues Spiel","green",function(){showPlayers(true)}));
 c.appendChild(button("▶️ Spiel fortsetzen","light",continueGame));
 c.appendChild(button("👥 Spieler verwalten","light",function(){showPlayers(false)}));
 c.appendChild(button("🕘 Spielhistorie","light",showHistory));
 if(db.game){var n=document.createElement("div");n.className="notice ok";n.textContent="Ein laufendes Spiel ist gespeichert.";c.appendChild(n)}
}
function continueGame(){if(db.game)showGame();else alert("Noch kein laufendes Spiel.")}
function showGameOrHome(){if(db.game)showGame();else showHome()}

function showPlayers(sm){
 startMode=!!sm;nav("nPlayers");
 // Beim Öffnen zunächst alle vorhandenen Spieler auswählen.
 if(!selectedPlayerIds.length)selectedPlayerIds=db.players.map(function(p){return String(p.id)});
 main.innerHTML='<div id="errorBox"></div><button class="back" id="backPlayers">‹ Zurück</button><section class="card"><h2>👥 Spieler</h2><p class="muted">Tippe die Spieler an, die bei der nächsten Partie mitspielen sollen.</p><div class="form"><input id="playerName" class="field" placeholder="Spielername"><button class="btn green" id="addPlayerBtn">＋ Hinzufügen</button></div><div id="selectionBar"></div><div id="plist"></div><div id="startArea"></div></section>';
 document.getElementById("backPlayers").onclick=function(){run(showHome)};
 document.getElementById("addPlayerBtn").onclick=function(){run(addPlayer)};
 renderPlayers();
}
function renderPlayers(){
 var box=document.getElementById("plist");box.innerHTML="";
 if(!db.players.length){box.innerHTML='<div class="notice">Noch keine Spieler angelegt.</div>'}
 db.players.forEach(function(p,idx){
   var selected=selectedPlayerIds.indexOf(String(p.id))>=0;
   var row=document.createElement("div");
   row.className="row selectable"+(selected?" selectedPlayer":"");
   var check=document.createElement("input");
   check.type="checkbox";check.className="pick";check.checked=selected;
   check.onclick=function(ev){ev.stopPropagation();togglePlayer(p.id)};
   row.onclick=function(){togglePlayer(p.id)};
   row.appendChild(check);

   var holder=document.createElement("div");
   holder.innerHTML=avatar(p)+'<div class="info"><b>'+esc(p.name)+'</b><small>'+(p.avatar?'Karikatur gespeichert ✓':'Noch kein Bild')+'</small></div>';
   // holder children need to sit in flex row, not nested wrapper styling
   while(holder.firstChild)row.appendChild(holder.firstChild);

   var e=button("🖼️","light",function(){editAvatar(idx)});e.style.width="auto";
   e.onclick=function(ev){ev.stopPropagation();run(function(){editAvatar(idx)})};
   var d=button("🗑️","red",function(){deletePlayer(idx)});d.style.width="auto";
   d.onclick=function(ev){ev.stopPropagation();run(function(){deletePlayer(idx)})};
   row.appendChild(e);row.appendChild(d);box.appendChild(row);
 });

 var count=selectedPlayerIds.length;
 document.getElementById("selectionBar").innerHTML='<div class="selectionBar">✓ '+count+' Spieler ausgewählt</div>';
 var a=document.getElementById("startArea");a.innerHTML="";
 if(count>=2)a.appendChild(button("🎲 Mit "+count+" Spielern Spiel starten",startMode?"green":"light",startGame));
 else a.innerHTML='<div class="notice">Bitte mindestens zwei Spieler auswählen.</div>';
}
function togglePlayer(id){
 id=String(id);
 var i=selectedPlayerIds.indexOf(id);
 if(i>=0)selectedPlayerIds.splice(i,1);else selectedPlayerIds.push(id);
 renderPlayers();
}
function addPlayer(){var v=document.getElementById("playerName").value.trim();if(!v){alert("Bitte Namen eingeben.");return}var newId=String(Date.now())+"_"+Math.random();db.players.push({id:newId,name:v,avatar:null,avatarPattern:"pat1",avatarFrame:"f1",avatarScale:1,avatarX:0,avatarY:0,games:0,totalWins:0,totalPoints:0});selectedPlayerIds.push(newId);saveDb();showPlayers(startMode)}
function deletePlayer(idx){if(confirm("Spieler wirklich löschen?")){var id=String(db.players[idx].id);db.players.splice(idx,1);selectedPlayerIds=selectedPlayerIds.filter(function(x){return x!==id});saveDb();showPlayers(startMode)}}

function editAvatar(idx){var p=db.players[idx];if(!p)return;editId=p.id;pendingAvatar=p.avatar||null;pattern=p.avatarPattern||"pat1";frame=p.avatarFrame||"f1";avatarScale=(p.avatarScale==null?1:Number(p.avatarScale));avatarX=Number(p.avatarX)||0;avatarY=Number(p.avatarY)||0;renderAvatar()}
function renderAvatar(){
 var p=db.players.find(function(x){return String(x.id)===String(editId)});if(!p)throw new Error("Spieler nicht gefunden");

 main.innerHTML='<div id="errorBox"></div><button class="back" id="backAvatar">‹ Zurück</button><section class="card"><h2>🖼️ Avatar für '+esc(p.name)+'</h2><p class="muted">Das Bild reicht bis direkt an den Rahmen. Ziehe die Karikatur einfach mit dem Finger an die gewünschte Position und zoome mit zwei Fingern hinein oder heraus.</p><div class="editor"><div><div class="preview '+pattern+'" style="border-color:'+frameColors[frame]+'"><div class="previewInner" id="avatarGestureArea">'+(pendingAvatar?'<img id="avatarPreviewImg" src="'+pendingAvatar+'" style="transform:translate('+avatarX+'%, '+avatarY+'%) scale('+avatarScale+')">':ini(p.name))+'</div></div></div><div><button class="btn green" id="uploadAvatar">📁 Karikatur/Bild hochladen</button><button class="btn red" id="removeAvatar">Bild entfernen</button><h3>Pastell-Hintergrund</h3><div class="swatches" id="swatches"></div><h3>Rahmenfarbe</h3><div class="frames" id="frames"></div>'+
 '<div class="gestureHint">👆 <b>Verschieben:</b> mit einem Finger ziehen<br>🤏 <b>Größe:</b> mit zwei Fingern auseinander- oder zusammenziehen</div><div class="controlGroup"><label>Feineinstellung Größe</label><input id="scaleRange" type="range" min="0.6" max="3.5" step="0.05" value="'+avatarScale+'"><div class="controlValue" id="scaleValue">'+Math.round(avatarScale*100)+' %</div></div>'+
 '<div class="controlGroup"><label>Bildposition</label><div class="controlValue" id="posValue">X '+Math.round(avatarX)+' · Y '+Math.round(avatarY)+'</div><button class="resetBtn" id="resetAvatar">Größe & Position zurücksetzen</button></div>'+
 '<label>Spielername</label><input id="avatarName" class="field" value="'+esc(p.name)+'"><button class="btn green" id="saveAvatarBtn">💾 Avatar speichern</button></div></div></section>';

 document.getElementById("backAvatar").onclick=function(){run(function(){showPlayers(startMode)})};
 document.getElementById("uploadAvatar").onclick=function(){document.getElementById("avatarFile").click()};
 document.getElementById("removeAvatar").onclick=function(){pendingAvatar=null;renderAvatar()};
 document.getElementById("saveAvatarBtn").onclick=function(){run(saveAvatar)};

 var s=document.getElementById("swatches");
 ["pat1","pat2","pat3","pat4","pat5","pat6","pat7","pat8"].forEach(function(x){
   var b=document.createElement("button");b.className="swatch "+x+(pattern===x?" sel":"");
   b.onclick=function(){pattern=x;renderAvatar()};s.appendChild(b);
 });
 var f=document.getElementById("frames");
 ["f1","f2","f3","f4","f5","f6"].forEach(function(x){
   var b=document.createElement("button");b.className="frame "+x;
   b.onclick=function(){frame=x;renderAvatar()};f.appendChild(b);
 });

 document.getElementById("scaleRange").oninput=function(e){avatarScale=Number(e.target.value);applyAvatarTransform()};
 document.getElementById("resetAvatar").onclick=function(){avatarScale=1;avatarX=0;avatarY=0;renderAvatar()};
 bindAvatarGestures();

 document.getElementById("avatarFile").onchange=function(e){
   var file=e.target.files[0];if(!file)return;
   var r=new FileReader();
   r.onload=function(ev){pendingAvatar=ev.target.result;avatarScale=1;avatarX=0;avatarY=0;renderAvatar()};
   r.readAsDataURL(file);
 };
}

function bindAvatarGestures(){
 var area=document.getElementById("avatarGestureArea");
 if(!area || !pendingAvatar)return;

 area.addEventListener("pointerdown",function(e){
   if(e.pointerType==="touch")return;
   area.setPointerCapture(e.pointerId);
   area.classList.add("dragging");
   dragStartX=e.clientX;dragStartY=e.clientY;dragBaseX=avatarX;dragBaseY=avatarY;
 });
 area.addEventListener("pointermove",function(e){
   if(!area.hasPointerCapture || !area.hasPointerCapture(e.pointerId))return;
   var rect=area.getBoundingClientRect();
   avatarX=dragBaseX+((e.clientX-dragStartX)/rect.width)*100;
   avatarY=dragBaseY+((e.clientY-dragStartY)/rect.height)*100;
   applyAvatarTransform();
 });
 area.addEventListener("pointerup",function(e){
   try{area.releasePointerCapture(e.pointerId)}catch(_){}
   area.classList.remove("dragging");
 });
 area.addEventListener("pointercancel",function(){area.classList.remove("dragging")});

 area.addEventListener("touchstart",function(e){
   if(e.touches.length===1){
     dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;
     dragBaseX=avatarX;dragBaseY=avatarY;
   }else if(e.touches.length===2){
     pinchStartDist=touchDistance(e.touches[0],e.touches[1]);
     pinchBaseScale=avatarScale;
   }
 },{passive:false});

 area.addEventListener("touchmove",function(e){
   e.preventDefault();
   var rect=area.getBoundingClientRect();
   if(e.touches.length===1){
     avatarX=dragBaseX+((e.touches[0].clientX-dragStartX)/rect.width)*100;
     avatarY=dragBaseY+((e.touches[0].clientY-dragStartY)/rect.height)*100;
     applyAvatarTransform();
   }else if(e.touches.length===2){
     var d=touchDistance(e.touches[0],e.touches[1]);
     if(pinchStartDist>0){

   }

function cardAssetUrl(rank,suit){
 var suitCode={"♣":"C","♦":"D","♥":"H","♠":"S"}[suit]||"";
 var rankCode=rank;
 if(rank==="B")rankCode="J";
 if(rank==="D")rankCode="Q";
 if(rank==="K")rankCode="K";
 if(rank==="A")rankCode="A";
 if(rank==="Joker")return "https://raw.githubusercontent.com/notpeter/Vector-Playing-Cards/master/cards-svg/Joker1.svg";
 return "https://raw.githubusercontent.com/notpeter/Vector-Playing-Cards/master/cards-svg/"+rankCode+suitCode+".svg";
}

 '<h3>1. Manuelle Punkteeingabe</h3><p class="muted">Wenn du die Summe schon kennst, direkt eintragen.</p><input id="manual" class="field" type="number" min="0" placeholder="Gesamt-Minuspunkte, z. B. 47"><button class="btn green" id="manualBtn">✅ Manuelle Punkte übernehmen</button>'+
 '<div class="sectionTitle"><h3>2. Fotoerkennung</h3><p class="muted">Restkarten fotografieren. Die erkannten Karten kannst du vor dem Übernehmen korrigieren.</p><div class="photoBox"><button class="btn light" id="photoBtn">📷 Karten fotografieren</button><div id="photoPreviewWrap"></div><button class="btn green" id="recognizeBtn" disabled>🔎 Karten online erkennen</button><div id="recognitionResult"></div></div></div>'+
 '<div class="sectionTitle"><h3>3. Karten auswählen</h3><p class="muted">Alternativ die Restkarten einzeln antippen.</p><div class="cardSourceNote">Darstellung als vollständige französische Spielkarten.</div><div class="cards" id="cardGrid"></div><div id="sel"></div><button class="btn light" id="undoBtn">↩️ Letzte entfernen</button><button class="btn light" id="clearBtn">🗑️ Leeren</button><button class="btn green" id="takeCardsBtn">✅ Kartenpunkte übernehmen</button></div></section>';

   r.readAsDataURL(file);
 };
 var g=document.getElementById("cardGrid"),ranks=["2","3","4","5","6","7","8","9","10","B","D","K","A"],suits=["♣","♠","♥","♦"];

function normalizeRecognizedCard(c){
 var rank=String(c.rank||"").toUpperCase().trim(),suit=String(c.suit||"").trim();
 if(rank==="J"||rank==="BUBE")rank="B";if(rank==="Q"||rank==="DAME")rank="D";if(rank==="KING"||rank==="KÖNIG")rank="K";if(rank==="ACE"||rank==="ASS")rank="A";
 if(rank==="JOKER")return {rank:"Joker",suit:"",confidence:Number(c.confidence)||0.5};
 var sm={"clubs":"♣","club":"♣","kreuz":"♣","♣":"♣","spades":"♠","spade":"♠","pik":"♠","♠":"♠","hearts":"♥","heart":"♥","herz":"♥","♥":"♥","diamonds":"♦","diamond":"♦","karo":"♦","♦":"♦"};
 suit=sm[String(suit).toLowerCase()]||sm[suit]||suit;return {rank:rank,suit:suit,confidence:Number(c.confidence)||0.5};
}
function recognizedValue(c){return cardValue(c.rank)}
function recognizeCardPhoto(){
 if(!cardPhotoData){alert("Bitte zuerst ein Kartenfoto aufnehmen.");return}
 var url=(db.online&&db.online.recognitionUrl||"").trim();if(!url){alert("Unter Einstellungen bitte zuerst die Recognition-URL eintragen.");return}
 var btn=document.getElementById("recognizeBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Erkennung läuft …';document.getElementById("recognitionResult").innerHTML='<div class="notice">Foto wird analysiert …</div>';
 fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:cardPhotoData})})
 .then(function(resp){if(!resp.ok)return resp.text().then(function(t){throw new Error("Server "+resp.status+": "+t)});return resp.json()})
 .then(function(data){recognizedCards=(data.cards||[]).map(normalizeRecognizedCard).filter(function(c){return c.rank==="Joker"||(["2","3","4","5","6","7","8","9","10","B","D","K","A"].indexOf(c.rank)>=0&&["♣","♠","♥","♦"].indexOf(c.suit)>=0)});renderRecognition()})
 .catch(function(err){document.getElementById("recognitionResult").innerHTML='<div class="notice" style="background:#ffeaea;color:#8b2828">Erkennung fehlgeschlagen: '+esc(err.message)+'</div>'})
 .finally(function(){btn.disabled=false;btn.textContent="🔎 Karten erneut erkennen"});
}
function renderRecognition(){
 var box=document.getElementById("recognitionResult");if(!box)return;var total=recognizedCards.reduce(function(sum,c){return sum+recognizedValue(c)},0);
 var chips=recognizedCards.map(function(c,i){var label=c.rank==="Joker"?"Joker":c.rank+c.suit;var pct=Math.round((c.confidence||0)*100);return '<div class="recognizedCard"><span>'+label+'</span><span class="conf">'+pct+'%</span><button onclick="removeRecognized('+i+')">×</button></div>'}).join("");
 box.innerHTML='<div class="recognitionBox"><div class="recognitionHead"><b>Erkannte Karten</b><span class="recognitionTotal">'+total+' Punkte</span></div><div class="recognizedList">'+(chips||'<span class="muted">Keine Karten erkannt.</span>')+'</div><div class="addCardRow"><select id="addRank"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>B</option><option>D</option><option>K</option><option>A</option><option>Joker</option></select><select id="addSuit"><option value="♣">♣ Kreuz</option><option value="♠">♠ Pik</option><option value="♥">♥ Herz</option><option value="♦">♦ Karo</option></select><button class="btn light" style="width:auto;margin:0" onclick="addRecognizedManual()">＋</button></div><button class="btn green" onclick="takeRecognizedScore()">✅ Erkennung übernehmen</button></div>';
}

function finishGame(){
 if(!confirm("Spiel beenden und speichern?"))return;
 var finished=JSON.parse(JSON.stringify(db.game));
 finished.finishedAt=new Date().toISOString();
 db.history.push(finished);

 var sorted=finished.players.slice().sort(function(a,b){return a.score-b.score});
 var winner=sorted.length?sorted[0]:null;

 db.players.forEach(function(p){
   var fp=finished.players.find(function(x){return String(x.id)===String(p.id)});
   if(!fp)return;
   p.games=(p.games||0)+1;
   p.totalPoints=(p.totalPoints||0)+fp.score;
   p.bestScore=(p.bestScore==null)?fp.score:Math.min(p.bestScore,fp.score);

 });
 db.game=null;
 saveDb();
 showHistory();
}
